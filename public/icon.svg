<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="50%" stop-color="#003825" />
      <stop offset="100%" stop-color="#021f14" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#10b981" stroke-width="12" />
  
  <!-- Drone Arm Crosshairs -->
  <line x1="120" y1="120" x2="392" y2="392" stroke="#10b981" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <line x1="392" y1="120" x2="120" y2="392" stroke="#10b981" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  
  <!-- 4 Drone Propellers -->
  <circle cx="120" cy="120" r="48" fill="#002f38" stroke="#4cd7f6" stroke-width="8" />
  <circle cx="392" cy="120" r="48" fill="#002f38" stroke="#4cd7f6" stroke-width="8" />
  <circle cx="120" cy="392" r="48" fill="#002f38" stroke="#4cd7f6" stroke-width="8" />
  <circle cx="392" cy="392" r="48" fill="#002f38" stroke="#4cd7f6" stroke-width="8" />
  
  <!-- Center Fuselage Ring -->
  <circle cx="256" cy="256" r="88" fill="#003825" stroke="#10b981" stroke-width="10" />
  
  <!-- Big Indian Rupee Symbol (₹) in Center -->
  <text x="256" y="292" font-family="system-ui, sans-serif" font-size="108" font-weight="900" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">₹</text>
  
  <!-- Bottom Green Sprout Leaf -->
  <path d="M 230 440 C 230 400, 282 400, 282 440 C 282 470, 230 470, 230 440 Z" fill="#10b981" />
</svg>
